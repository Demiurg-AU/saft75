name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify core install
        run: |
          python -m venv .venv-core
          .venv-core/bin/pip install -e .
          .venv-core/bin/python -c "import meta_optimizer, meta_optimizer.temporal_memory, meta_optimizer.orchestration"

      - name: Install optimization and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install -e ".[onnx,test]"

      - name: Run smoke tests
        run: python -m pytest -q
